<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduGenie | AI Learning Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>
<body>
    <main class="container">
        <section class="hero">
            <span class="badge">AI-POWERED LEARNING</span>
            <h1>EduGenie</h1>
            <p>Your intelligent study companion for understanding, practicing,
               revising and planning your learning journey.</p>
        </section>

        <section class="card">
            <label for="task">Choose a learning task</label>
            <select id="task">
                <option value="qa">Ask a Question</option>
                <option value="explain">Explain a Concept</option>
                <option value="quiz">Generate Quiz</option>
                <option value="summarize">Summarize Notes</option>
                <option value="learn">Learning Path</option>
            </select>

            <label for="inputText">Your input</label>
            <textarea id="inputText"
                placeholder="Ask a question, enter a topic, or paste your notes..."></textarea>

            <button id="submitBtn" onclick="runTask()">Generate</button>

            <div id="status" class="status"></div>
            <div id="result" class="result hidden"></div>
        </section>

        <section class="features">
            <div><strong>Q&A</strong><span>Ask academic questions</span></div>
            <div><strong>Explain</strong><span>Simplify difficult concepts</span></div>
            <div><strong>Quiz</strong><span>Practice with MCQs</span></div>
            <div><strong>Summary</strong><span>Revise long notes quickly</span></div>
            <div><strong>Learn</strong><span>Build a study roadmap</span></div>
        </section>
    </main>

    <script>
        const endpoints = {
            qa: "/qa",
            explain: "/explain",
            quiz: "/quiz",
            summarize: "/summarize",
            learn: "/learn/recommendations"
        };

        function escapeHtml(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function renderResult(data) {
            const result = document.getElementById("result");
            result.classList.remove("hidden");

            if (Array.isArray(data.result)) {
                result.innerHTML = data.result.map((q, i) => `
                    <article class="quiz-question">
                        <h3>${i + 1}. ${escapeHtml(q.question)}</h3>
                        <ol type="A">
                            ${q.options.map((option, index) =>
                                `<li>${escapeHtml(option)}</li>`
                            ).join("")}
                        </ol>
                        <p class="answer"><strong>Answer:</strong>
                            ${escapeHtml(q.answer)}</p>
                    </article>
                `).join("");
                return;
            }

            result.innerHTML = `<div class="text-result">${
                escapeHtml(data.result).replaceAll("\n", "<br>")
            }</div>`;
        }

        async function runTask() {
            const task = document.getElementById("task").value;
            const text = document.getElementById("inputText").value.trim();
            const status = document.getElementById("status");
            const button = document.getElementById("submitBtn");

            if (!text) {
                status.textContent = "Please enter a topic, question, or passage.";
                return;
            }

            status.textContent = "EduGenie is thinking...";
            button.disabled = true;

            try {
                const response = await fetch(endpoints[task], {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({text})
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Request failed.");
                }

                renderResult(data);
                status.textContent = "Completed.";
            } catch (error) {
                status.textContent = error.message;
                document.getElementById("result").classList.add("hidden");
            } finally {
                button.disabled = false;
            }
        }
    </script>
</body>
</html>
